# Top-level config: picks one option from each group below by default. Override any of them
# on the command line, e.g. `python train.py model=deep_head data.batch_size=32`.
defaults:
  - data: tinystories
  - model: base
  - training: default
  - wandb: default
  - atlas: default
  - corpus: tinystories
  - steering: default
  - _self_

seed: 1337

hydra:
  job:
    # Hydra normally cds into a per-run output dir; we keep the invocation directory instead so
    # relative paths (e.g. data.data_dir: ./data) resolve against wherever you actually ran the
    # command from. Hydra still writes its own run config/log under outputs/<date>/<time>/.
    chdir: false
