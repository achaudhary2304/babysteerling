# Describes the raw corpus/corpora: where to get them and how they're structured -- nothing
# about how they're processed (that's atlas.*). `sources` is always a list -- one entry for a
# single corpus, several for a union. To train on the union of multiple corpora, just add more
# entries here (or copy this whole file to define a different combination, e.g.
# configs/corpus/my_union.yaml, and run `python build_dataset.py corpus=my_union`). Every source
# is downloaded, tagged, and assigned independently, but they all share ONE concept library
# (built from all their tags combined) and ONE tokenizer -- that shared library is what makes
# "training on the union" mean something, rather than just concatenating unrelated datasets.
#
# Each source has its own document_delimiter (whatever string its raw file actually uses to
# separate documents -- different sources are free to use different delimiters). Nothing in
# babysteerling's code is specific to TinyStories, it just needs plain-text files with documents
# separated by a delimiter, each short enough to be treated as one chunk.
tokenizer_vocab_size: 2000
# artificial marker the pipeline inserts after every chunk in the *tokenized* stream -- unlike
# document_delimiter above, this is not read from any source's raw text, so it stays one single
# value even when sources use different delimiters (see prepare.train_tokenizer()'s docstring)
boundary_token: "<|endoftext|>"

sources:
  - name: tinystories
    url: https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt
    document_delimiter: "<|endoftext|>"
  # - name: my_other_corpus
  #   url: https://example.com/my_other_corpus.txt
  #   document_delimiter: "<|endoftext|>"
