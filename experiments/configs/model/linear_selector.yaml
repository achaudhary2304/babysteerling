# Prototype-based concept encoder:
# 1) a single linear layer + topk selects concept candidates
# 2) the backbone yields embedding representations of prototypes of selected concept candidates
# 3) the similarities between a token and each prototype embeddings yields weights
# 4) token's concept activation is the convex combination of similarity weights and ground-truth labels associated with each prototype
# Requires the dataset to have been built with atlas.enable_prototypes=true (concept_prototypes.json).
defaults:
  - base
  - _self_

wandb_name: linear_selector
known_encoder_type: linear_selector
use_concept_loss: false   # no need to compute concept loss for linear_selector
