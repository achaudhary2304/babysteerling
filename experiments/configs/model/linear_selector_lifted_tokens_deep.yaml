# Same as linear_selector.yaml, but scores candidates against each concept's own top lifted
# tokens (babysteerling.data.babyatlas.compute_lifted_tokens) instead of concept_prototypes.json's
# LLM-generated prototype sentences -- see nn.prototype.LiftedTokenPredictor. Requires the
# dataset's lifted_tokens.json/lifted_tokens_negative.json (built by build_dataset.py
# unconditionally, no atlas.enable_prototypes needed).
defaults:
  - base
  - _self_

wandb_name: linear_selector_lifted_tokens_deep
known_encoder_type: linear_selector
predictor_type: lifted_tokens
use_concept_loss: false   # no need to compute concept loss for linear_selector

head:
  type: mlp
  tie_weights: false
