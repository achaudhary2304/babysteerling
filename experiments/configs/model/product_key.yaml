# Product-key known-concept encoder (babysteerling.nn.prototype.ProductKeySelector): factorized
# row/col retrieval against each concept's own prototype texts. Cost O(sqrt(Kt) + topk_axis**2)
# per token instead of a dense O(Kt) projection. Requires the dataset to have been built with
# atlas.enable_prototypes=true (concept_prototypes.json). Everything else inherits from base.
defaults:
  - base
  - _self_

known_encoder_type: product_key
