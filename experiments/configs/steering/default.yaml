# Steering (Section 6.2) + steering-training (Section 10.2.4). Off by default: the base model
# trains and evaluates exactly as before unless you opt in with `steering.enabled=true`.
enabled: true

# Injection strength calibration target tau (Eq. 19): gamma = tau / peak(e_c).
tau: 4.0

# Inject from this transformer block onward (0-indexed); L_inj in the paper's notation.
inj_layer: 1

# Interleave one steering-training step every N ordinary training steps.
every_n_steps: 10

# Weights on the two steering-training losses (Eq. 31/32), added on top of the LM loss during
# steering steps -- concept/reconstruction/independence losses are left out of those steps.
lambda_respond: 1.0
lambda_express: 1.0
