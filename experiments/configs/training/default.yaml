# Optimization schedule and loss weights.
lr: 3e-4
min_lr: 3e-5
warmup_steps: 200
max_steps: 5000
eval_interval: 200
eval_iters: 50
checkpoint_interval: 200  # how often to save a resumable checkpoint (see train.py's resume logic) -- kept small since MPS crashes have hit as early as ~200 steps
grad_clip: 1.0
weight_decay: 0.1

# loss term weights (paper's Eq. 15: L = L_lm + lambda_concept*L_concept + lambda_rec*L_rec + lambda_indep*L_indep)
lambda_concept: 1.0
lambda_rec: 1.0
lambda_indep: 2.0

# sanity-check generation at the end of training
gen_max_new_tokens: 500   # causal backbone only
# diffusion only: total denoising steps. null commits one position per step, which is best
# quality; an int is faster but commits several per step from a single forward pass
gen_steps: null
gen_temperature: 0.8
gen_top_k: 50
