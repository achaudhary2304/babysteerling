# Ablation baseline: zero out every concept-related loss term, so only the language modeling loss trains the model.
# The concept  bottleneck architecture is exactly the same, but nothing pushes those heads to learn anything meaningful.
# Useful as a baseline to compare against runs where the concept losses are active.
defaults:
  - default
  - _self_

lambda_concept: 0.0
lambda_rec: 0.0
lambda_indep: 0.0
