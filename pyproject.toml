[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babysteerling"
version = "0.1.0"
description = "A small, laptop-trainable implementation of the Steerling concept-bottleneck language model architecture."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Pietro Barbiero", email = "barbiero@tutanota.com" }]
requires-python = ">=3.9"
dependencies = [
    "torch",
    "tokenizers",
]

[project.optional-dependencies]
# heavier dependencies only needed to build a concept dataset (babysteerling.data.atlas),
# kept separate so installing the model itself doesn't force them on everyone
atlas = [
    "transformers",
    "sentence-transformers",
    "scikit-learn",
    "accelerate",
]
# only needed for babysteerling.steering (concept interventions / steering); kept separate since
# pytorch-concepts pulls in a heavy, unrelated dependency chain (scikit-learn, scipy, pgmpy,
# networkx, sympy, pytorch-lightning, pytorch-minimize) that the base model doesn't need
steering = [
    "pytorch-concepts==1.0.0a5",  # pre-release; exact pin so `pip install -e ".[steering]"` works without --pre
]

[project.urls]
Homepage = "https://github.com/pietrobarbiero/babysteerling"

[tool.setuptools.packages.find]
include = ["babysteerling*"]
